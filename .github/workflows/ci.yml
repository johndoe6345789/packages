# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (test_example_comprehensive)
        working-directory: test_example_comprehensive
        run: npm install
      - name: Install (ui_database_manager)
        working-directory: ui_database_manager
        run: npm install
      - name: Install (ui_json_script_editor)
        working-directory: ui_json_script_editor
        run: npm install
      - name: Install (ui_schema_editor)
        working-directory: ui_schema_editor
        run: npm install
      - name: Install (ui_workflow_editor)
        working-directory: ui_workflow_editor
        run: npm install
