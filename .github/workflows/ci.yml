# Generated for the reposplit micro-repo layout.
# Steps are emitted only for tooling this repo actually contains.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install (admin)
        working-directory: admin
        run: npm install
      - name: Install (admin_dialog)
        working-directory: admin_dialog
        run: npm install
      - name: Install (arcade_lobby)
        working-directory: arcade_lobby
        run: npm install
      - name: Install (audit_log)
